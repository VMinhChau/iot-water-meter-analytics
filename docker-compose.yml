version: "3.8"

networks:
  spark-net:
    driver: bridge

services:
  zookeeper:
    image: confluentinc/cp-zookeeper:7.4.0
    environment:
      ZOOKEEPER_CLIENT_PORT: 2181
      ZOOKEEPER_TICK_TIME: 2000
    mem_limit: 1.5g
    ports:
      - "2181:2181"
    networks:
      - spark-net

  kafka:
    image: confluentinc/cp-kafka:7.4.0
    depends_on:
      - zookeeper
    ports:
      - "9092:9092"
      - "29092:29092"
    environment:
      KAFKA_BROKER_ID: 1
      KAFKA_ZOOKEEPER_CONNECT: zookeeper:2181
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka:9092,PLAINTEXT_HOST://localhost:29092
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: PLAINTEXT:PLAINTEXT,PLAINTEXT_HOST:PLAINTEXT
      KAFKA_LISTENERS: PLAINTEXT://:9092,PLAINTEXT_HOST://:29092
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_AUTO_CREATE_TOPICS_ENABLE: "true"
      KAFKA_HEAP_OPTS: "-Xmx1G -Xms1G"
    mem_limit: 1.5g
    networks:
      - spark-net

  kafka-ui:
    image: provectuslabs/kafka-ui:latest
    depends_on:
      - kafka
    mem_limit: 1.5g
    ports:
      - "8080:8080"
    environment:
      KAFKA_CLUSTERS_0_NAME: local
      KAFKA_CLUSTERS_0_BOOTSTRAPSERVERS: kafka:9092
    networks:
      - spark-net

  spark-master:
    image: apache/spark:3.5.0
    container_name: spark-master
    command: ["/opt/spark/sbin/start-master.sh", "-h", "spark-master"]
    ports:
      - "8081:8080"
      - "7077:7077"
    environment:
      - SPARK_NO_DAEMONIZE=true
      - SPARK_MASTER_PORT=7077
      - SPARK_MASTER_WEBUI_PORT=8080
      - PYTHONPATH=/opt/spark-apps/lambda_architecture
    mem_limit: 1.5g
    volumes:
      - ./lambda_architecture:/opt/spark-apps/lambda_architecture
      - ./hadoop/conf/core-site.xml:/opt/hadoop/conf/core-site.xml
      - ./hadoop/conf/hdfs-site.xml:/opt/hadoop/conf/hdfs-site.xml
      - ./data/managedobject_details.csv:/tmp/managedobject_details.csv
    networks:
      - spark-net

  spark-worker-1:
    image: apache/spark:3.5.0
    container_name: spark-worker-1
    depends_on:
      - spark-master
    command: ["/opt/spark/sbin/start-worker.sh", "spark://spark-master:7077"]
    environment:
      - SPARK_NO_DAEMONIZE=true
      - SPARK_WORKER_CORES=2
      - SPARK_WORKER_MEMORY=2g
      - SPARK_WORKER_PORT=8881
      - SPARK_WORKER_WEBUI_PORT=8082
      - PYTHONPATH=/opt/spark-apps/lambda_architecture
    mem_limit: 1.5g
    ports:
      - "8082:8082"
    volumes:
      - ./lambda_architecture:/opt/spark-apps/lambda_architecture
      - ./data/managedobject_details.csv:/tmp/managedobject_details.csv
    networks:
      - spark-net

  spark-worker-2:
    image: apache/spark:3.5.0
    container_name: spark-worker-2
    depends_on:
      - spark-master
    command: ["/opt/spark/sbin/start-worker.sh", "spark://spark-master:7077"]
    environment:
      - SPARK_NO_DAEMONIZE=true
      - SPARK_WORKER_CORES=2
      - SPARK_WORKER_MEMORY=2g
      - SPARK_WORKER_PORT=8882
      - SPARK_WORKER_WEBUI_PORT=8083
      - PYTHONPATH=/opt/spark-apps/lambda_architecture
    mem_limit: 1.5g
    ports:
      - "8084:8084"
    volumes:
      - ./lambda_architecture:/opt/spark-apps/lambda_architecture
      - ./data/managedobject_details.csv:/tmp/managedobject_details.csv
    networks:
      - spark-net

  namenode:
    image: bde2020/hadoop-namenode:2.0.0-hadoop3.2.1-java8
    container_name: namenode
    environment:
      - CLUSTER_NAME=water_meter
      - CORE_CONF_fs_defaultFS=hdfs://namenode:8020
    mem_limit: 1.5g
    ports:
      - "9870:9870"
      - "8020:8020"
    volumes:
      - namenode_data:/hadoop/dfs/name
    networks:
      - spark-net

  datanode:
    image: bde2020/hadoop-datanode:2.0.0-hadoop3.2.1-java8
    container_name: datanode
    depends_on:
      - namenode
    environment:
      - CORE_CONF_fs_defaultFS=hdfs://namenode:8020
      - SERVICE_PRECONDITION=namenode:9870
    mem_limit: 1.5g
    ports:
      - "9864:9864"
      - "9866:9866"
    volumes:
      - datanode_data:/hadoop/dfs/data
    networks:
      - spark-net

  elasticsearch:
    image: docker.elastic.co/elasticsearch/elasticsearch:8.11.1
    container_name: elasticsearch
    environment:
      - discovery.type=single-node
      - ES_JAVA_OPTS=-Xms512m -Xmx512m
      - xpack.security.enabled=false
      - xpack.monitoring.collection.enabled=false
      - xpack.ml.enabled=false
      - xpack.security.enrollment.enabled=false
    mem_limit: 1g
    mem_reservation: 512m
    ulimits:
      memlock:
        soft: -1
        hard: -1
    ports:
      - "9200:9200"
      - "9300:9300"
    networks:
      - spark-net
    volumes:
      - es_data:/usr/share/elasticsearch/data

  kibana:
    image: docker.elastic.co/kibana/kibana:8.11.1
    container_name: kibana
    depends_on:
      - elasticsearch
    mem_limit: 700m
    mem_reservation: 300m
    ports:
      - "5601:5601"
    environment:
      - ELASTICSEARCH_HOSTS=http://elasticsearch:9200
      - XPACK_SECURITY_ENABLED=false
    networks:
      - spark-net

  spark-thrift:
    image: apache/spark:3.5.0
    container_name: spark-thrift
    user: "0:0"
    depends_on:
      namenode:
        condition: service_healthy
      hive-metastore-service:
        condition: service_started
      spark-master:
        condition: service_started
    mem_limit: 700m
    mem_reservation: 300m
    command: >
      /opt/spark/sbin/start-thriftserver.sh
      --master spark://spark-master:7077
      --packages io.delta:delta-spark_2.12:3.1.0
      --conf spark.sql.extensions=io.delta.sql.DeltaSparkSessionExtension
      --conf spark.sql.catalog.spark_catalog=org.apache.spark.sql.delta.catalog.DeltaCatalog
      --conf spark.sql.warehouse.dir=hdfs://namenode:8020/user/hive/warehouse
      --conf spark.hadoop.hive.metastore.uris=thrift://hive-metastore-service:9083
      --conf spark.hadoop.javax.jdo.option.ConnectionURL=jdbc:mysql://hive-metastore:3306/metastore?useSSL=false&allowPublicKeyRetrieval=true
      --conf spark.hadoop.javax.jdo.option.ConnectionDriverName=com.mysql.cj.jdbc.Driver
      --conf spark.hadoop.javax.jdo.option.ConnectionUserName=hive
      --conf spark.hadoop.javax.jdo.option.ConnectionPassword=hive
      --hiveconf hive.server2.thrift.port=10000
      --hiveconf hive.server2.thrift.bind.host=0.0.0.0
    environment:
      - SPARK_NO_DAEMONIZE=true
      - PYTHONPATH=/opt/spark-apps/lambda_architecture
    volumes:
      - ./lambda_architecture:/opt/spark-apps/lambda_architecture
      - ./data/managedobject_details.csv:/tmp/managedobject_details.csv
      - spark-ivy:/home/spark/.ivy2
    ports:
      - "10000:10000"
      - "10002:10002"
    networks:
      - spark-net

    # Add to your docker-compose.yml
  hive-metastore:
      image: mysql:8.0  # [Fix 1] Pin to 8.0 to avoid 8.4 breaking changes
      container_name: hive-metastore
      environment:
        MYSQL_ROOT_PASSWORD: root
        MYSQL_DATABASE: metastore
        MYSQL_USER: hive
        MYSQL_PASSWORD: hive
      command: --default-authentication-plugin=mysql_native_password
      ports:
        - "3306:3306"
      volumes:
        - hive-metastore-data:/var/lib/mysql

  hive-metastore-service:
    image: apache/hive:3.1.3
    container_name: hive-metastore-service
    depends_on:
      - hive-metastore
    environment:
      SERVICE_NAME: metastore
      # [Fix 2] Force Hive to use MapReduce (mr) to avoid 'TezConfiguration' error
      HIVE_SITE_CONF_hive_execution_engine: "mr" 
      
      # [Fix 3] Configure MySQL Connection using HIVE_SITE_CONF vars
      # This forces these values into hive-site.xml
      HIVE_SITE_CONF_javax_jdo_option_ConnectionURL: "jdbc:mysql://hive-metastore:3306/metastore?useSSL=false&allowPublicKeyRetrieval=true"
      HIVE_SITE_CONF_javax_jdo_option_ConnectionDriverName: "com.mysql.cj.jdbc.Driver"
      HIVE_SITE_CONF_javax_jdo_option_ConnectionUserName: "hive"
      HIVE_SITE_CONF_javax_jdo_option_ConnectionPassword: "hive"
    ports:
      - "9083:9083"
    volumes:
      # You MUST still have the mysql jar file in your local folder
      - ./mysql-connector-j-8.0.33.jar:/opt/hive/lib/mysql-connector-java.jar
    command:
      - /bin/sh
      - -c
      - |
        echo "Waiting for MySQL..."
        while ! nc -z hive-metastore 3306; do sleep 1; done
        
        echo "Initializing Schema..."
        # Try to init schema, ignore error if it already exists
        /opt/hive/bin/schematool -dbType mysql -initSchema -verbose || true
        
        echo "Starting Metastore..."
        /opt/hive/bin/hive --service metastore
    networks:
      - spark-net

volumes:
  namenode_data:
  datanode_data:
  es_data:
  hive-metastore-data:
  spark-ivy:
